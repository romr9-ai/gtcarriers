    function Logo() {
      return e('a', { href: "#top", className: "flex items-center space-x-2 text-white" }, 
        e('img', { src: LOGO_URL, alt: "GT Carriers Logo", className: "h-12" })

    function LanguageSwitcher({ language, setLanguage }) {
        const toggleLanguage = () => {
            setLanguage(lang => lang === 'es' ? 'en' : 'es');
        };
        return e('button', { onClick: toggleLanguage, className: "text-white font-semibold border-2 border-white rounded-md px-3 py-1 text-sm hover:bg-white hover:text-gray-900 transition-colors" }, 
            language === 'es' ? 'EN' : 'ES'
        );
    }

    function Navbar({ language, setLanguage, navItems, quoteButton }) {
        const [isOpen, setIsOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);

        useEffect(() => {
            const handleScroll = () => setScrolled(window.scrollY > 10);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
        }, []);

      return e('nav', { className: `fixed top-0 left-0 w-full z-30 p-4 transition-all duration-300 ${scrolled ? 'nav-scrolled' : 'bg-transparent'}`},
        e('div', { className: "container mx-auto flex justify-between items-center" },
            e(Logo),
            e('div', { className: "hidden md:flex items-center space-x-8" }, 
              navItems.map(item => e('a', { key: item.href, href: item.href, className: "text-white font-semibold hover:text-red-500 transition-colors" }, item.label))
            ),
            e('div', { className: "hidden md:flex items-center space-x-4" },
                e('a', { href: "#contact", className: "bg-red-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-700 transition-all" }, quoteButton),
                e(LanguageSwitcher, { language, setLanguage })
            ),
            e('button', { className: "md:hidden text-white", onClick: () => setIsOpen(!isOpen) },
              e('svg', { className: "w-8 h-8", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, 
                e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: isOpen ? "M6 18L18 6M6 6l12 12" : "M4 6h16M4 12h16m-7 6h7" })
              )
            )
        ),
        isOpen && e('div', { className: "md:hidden mt-4 bg-black bg-opacity-80 rounded-lg p-4" },
            navItems.map(item => e('a', { key: item.href, href: item.href, onClick: () => setIsOpen(false), className: "block text-white text-center py-2 font-semibold hover:bg-red-600 rounded-lg" }, item.label)),
            e('a', { href: "#contact", onClick: () => setIsOpen(false), className: "block text-center mt-2 bg-red-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-700 transition-all" }, quoteButton),
            e('div', { className: "mt-4 pt-4 border-t border-gray-600 flex justify-center" }, 
                e(LanguageSwitcher, { language, setLanguage })
            )
        )
      );
    }

    function HeroSlider({ language, heroQuoteButton, ariaLabels }) {
        const [index, setIndex] = useState(0);

        useEffect(() => {
            const timer = setInterval(() => {
                setIndex(prev => (prev + 1) % LOCATIONS.length);
            }, 7000);
            return () => clearInterval(timer);
        }, []);

        const prev = () => setIndex((index - 1 + LOCATIONS.length) % LOCATIONS.length);
        const next = () => setIndex((index + 1) % LOCATIONS.length);

        return e('header', { id: "top", className: "relative w-full h-screen bg-black" },
            LOCATIONS.map((loc, i) => e('div', { key: loc.name, className: `absolute top-0 left-0 w-full h-full transition-opacity duration-1000 ${i === index ? 'opacity-100' : 'opacity-0'}` },
                e('img', { src: loc.image, alt: loc.name, className: "w-full h-full object-cover" }),
                e('div', { className: "absolute top-0 left-0 w-full h-full hero-gradient" })
            )),
            e('div', { className: "relative h-full flex flex-col justify-center items-center text-center text-white p-4" },
                e('h1', { className: "text-4xl md:text-7xl font-black uppercase tracking-tighter animate-fade-in-down" }, LOCATIONS[index].name),
                e('p', { className: "text-lg md:text-2xl mt-4 max-w-3xl animate-fade-in-up" }, LOCATIONS[index].address),
                e('a', { href: "#contact", className: "mt-8 bg-red-600 text-white font-bold py-3 px-8 rounded-lg text-lg hover:bg-red-700 transition-transform hover:scale-105" }, heroQuoteButton)
            ),
            e('button', { onClick: prev, className: "absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 text-white p-2 rounded-full hover:bg-white/40 transition-colors", 'aria-label': ariaLabels.prevSlide },
                e('svg', { className: "w-6 h-6", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M15 19l-7-7 7-7" }))
            ),
            e('button', { onClick: next, className: "absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 text-white p-2 rounded-full hover:bg-white/40 transition-colors", 'aria-label': ariaLabels.nextSlide },
                e('svg', { className: "w-6 h-6", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M9 5l7 7-7 7" }))
            )
        );
    }
    
    function About({ content }) {
      return e('section', { className: "py-20 bg-gray-50", id: "about" },
        e('div', { className: "container mx-auto px-4" },
            e('div', { className: "grid md:grid-cols-2 gap-12 items-center" },
                e('div', { className: "order-2 md:order-1" },
                    e('h2', { className: "section-title text-gray-800" }, content.title),
                    e('p', { className: "section-subtitle mt-4" }, content.subtitle),
                    e('p', { className: "mt-4 text-gray-600" }, content.body)
                ),
                e('div', { className: "order-1 md:order-2" },
                    e('img', { 
                        src: "https://images.pexels.com/photos/1267325/pexels-photo-1267325.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1", 
                        alt: content.fleetAlt, 
                        className: "rounded-lg shadow-xl w-full",
                        loading: "lazy",
                        decoding: "async"
                    })
                )
            )
        )
      );
    }

    function Services({ content }) {
        const icons = [SERVICE_ICONS.transloading, SERVICE_ICONS.drayage, SERVICE_ICONS.ltl, SERVICE_ICONS.tpl];
        return e('section', { className: "py-20", id: "services" },
            e('div', { className: "container mx-auto px-4 text-center" },
                e('h2', { className: "section-title text-gray-800" }, content.title),
                e('p', { className: "section-subtitle max-w-3xl mx-auto" }, content.subtitle),
                e('div', { className: "grid sm:grid-cols-2 lg:grid-cols-4 gap-8 mt-12 text-left" },
                    content.serviceList.map((s, i) => e('div', { className: "bg-white p-8 rounded-lg shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300", key: s.title },
                        e('div', { className: "mb-4" }, icons[i]),
                        e('h3', { className: "text-xl font-bold text-gray-800 mb-2" }, s.title),
                        e('p', { className: "text-gray-600" }, s.text)
                    ))
                )
            )
        );
    }
    
    function Strengths({ content }) {
        const icons = [STRENGTH_ICONS.founded, STRENGTH_ICONS.employees, STRENGTH_ICONS.chassis, STRENGTH_ICONS.dispatch];
        return e('section', { className: "py-20 bg-gray-800 text-white", id: "strengths" },
            e('div', { className: "container mx-auto px-4" },
                e('div', { className: "grid grid-cols-2 md:grid-cols-4 gap-8 text-center" },
                    content.stats.map((s, i) => e('div', { key: s.label, className: "flex flex-col items-center" },
                        e('svg', { className: "w-12 h-12 text-red-500 mb-3", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: icons[i] })),
                        e('div', { className: "text-4xl font-extrabold" }, s.value),
                        e('div', { className: "text-gray-300 mt-1" }, s.label)
                    ))
                ),
                e('div', { className: "mt-16 text-center" },
                    e('h3', { className: "text-2xl font-bold mb-4" }, content.certsTitle),
                    e('div', { className: "flex flex-wrap justify-center items-center gap-x-6 gap-y-2" },
                       CERTS.map(c => e('span', { key: c, className: "font-semibold text-gray-200" }, c))
                    )
                )
            )
        );
    }

    function Locations({ content }) {
        return e('section', { className: "py-20 bg-gray-50", id: "locations" },
            e('div', { className: "container mx-auto px-4" },
                e('h2', { className: "section-title text-gray-800 text-center" }, content.title),
                e('p', { className: "section-subtitle text-center max-w-3xl mx-auto" }, content.subtitle),
                e('div', { className: "grid md:grid-cols-2 gap-8 mt-12" },
                    LOCATIONS.map(y => e('div', { className: "bg-white rounded-lg shadow-lg overflow-hidden group", key: y.name },
                        e('img', { 
                            src: y.image, 
                            alt: y.name, 
                            className: "w-full h-64 object-cover group-hover:scale-105 transition-transform duration-300",
                            loading: "lazy",
                            decoding: "async"
                        }),
                        e('div', { className: "p-6" },
                            e('h3', { className: "text-xl font-bold text-gray-800" }, y.name),
                            e('p', { className: "text-gray-600 mt-1" }, y.address)
                        )
                    ))
                )
            )
        );
    }
    
    function Contact({ content }) {
        const [status, setStatus] = useState("idle");
        const onSubmit = (e) => {
            e.preventDefault();
            setStatus("sending");
            setTimeout(() => {
                setStatus("sent");
                e.target.reset();
                setTimeout(() => setStatus("idle"), 3000);
            }, 1000);
        };

        return e('section', { className: "py-20", id: "contact" },
            e('div', { className: "container mx-auto px-4" },
                e('div', { className: "grid lg:grid-cols-2 gap-12 items-start" },
                    e('div', null,
                        e('h2', { className: "section-title text-gray-800" }, content.title),
                        e('p', { className: "section-subtitle mt-4" }, content.subtitle),
                        e('div', { className: "mt-8 space-y-4" },
                            e('div', { className: "flex items-start gap-4" },
                                e('svg', { className: "w-6 h-6 text-red-600 mt-1 flex-shrink-0", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, 
                                    e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" }),
                                    e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M15 11a3 3 0 11-6 0 3 3 0 016 0z" })
                                ),
                                e('div', null,
                                    e('h4', { className: "font-bold text-gray-800" }, content.office),
                                    e('p', { className: "text-gray-600" }, "2799 Calzada Cetys and Calle Cuarta Building C-Local 11, Colonia Rivera Mexicali, B.C.")
                                )
                            ),
                            e('div', { className: "flex items-start gap-4" },
                                e('svg', { className: "w-6 h-6 text-red-600 mt-1 flex-shrink-0", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, 
                                    e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" })
                                ),
                                e('div', null,
                                    e('h4', { className: "font-bold text-gray-800" }, content.phone),
                                    e('p', { className: "text-gray-600" }, "(686) 565-8581")
                                )
                            )
                        )
                    ),
                    e('form', { className: "bg-white p-8 rounded-lg shadow-2xl", onSubmit },
                        e('div', { className: "grid sm:grid-cols-2 gap-6" },
                            e('div', null,
                                e('label', { className: "font-semibold text-gray-700 block mb-2" }, content.form.name),
                                e('input', { className: "w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent", required: true })
                            ),
                            e('div', null,
                                e('label', { className: "font-semibold text-gray-700 block mb-2" }, content.form.company),
                                e('input', { className: "w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" })
                            ),
                            e('div', { className: "sm:col-span-2" },
                                e('label', { className: "font-semibold text-gray-700 block mb-2" }, content.form.email),
                                e('input', { type: "email", className: "w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent", required: true })
                            ),
                            e('div', { className: "sm:col-span-2" },
                                e('label', { className: "font-semibold text-gray-700 block mb-2" }, content.form.message),
                                e('textarea', { className: "w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent", rows: 5, required: true })
                            )
                        ),
                        e('div', { className: "mt-6" },
                            e('button', { className: "w-full bg-red-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-red-700 transition-all text-lg", disabled: status !== "idle" },
                                status === 'idle' ? content.form.sendButton :
                                status === 'sending' ? content.form.sendingButton :
                                content.form.sentButton
                            )
                        )
                    )
                )
            )
        );
    }

    function Footer({ language, setLanguage, content }) {
        const year = new Date().getFullYear();
        return e('footer', { className: "py-8 footer-custom-bg text-gray-400" },
            e('div', { className: "container mx-auto px-4 text-center" },
                e('div', { className: "flex justify-center" }, e(Logo)),
                e('p', { className: "mt-4 max-w-2xl mx-auto" }, content.motto),
                e('div', { className: "mt-6 flex justify-center" }, e(LanguageSwitcher, { language, setLanguage })),
                e('div', { className: "mt-6 border-t border-gray-700 pt-6 flex flex-col sm:flex-row justify-between items-center gap-4" },
                    e('p', { className: "text-sm" }, `© ${year} GT Carriers Inc. ${content.copyright}`),
                    e('p', { className: "text-sm font-semibold text-gray-300" }, "CTPAT • TSA • BONDED CARRIER")
                )
            )
        );
    }
    
    function App() {
        const [language, setLanguage] = useState('es');
        const currentContent = content[language];

        useEffect(() => {
            document.documentElement.lang = language;
            const descriptionMeta = document.querySelector('meta[name="description"]');
            if (descriptionMeta) {
                descriptionMeta.setAttribute('content', language === 'es' ? 'GT Carriers: Su socio logístico de confianza desde 1993. Ofrecemos soluciones integrales de transporte, drayage, LTL/FTL y almacenaje en el sur de California y la frontera.' : 'GT Carriers: Your trusted logistics partner since 1993. We offer comprehensive solutions for transport, drayage, LTL/FTL, and warehousing in Southern California and the border.');
            }
        }, [language]);

        return e(Fragment, null,
            e(Navbar, { language, setLanguage, navItems: currentContent.navItems, quoteButton: currentContent.quoteButton }),
            e('main', null,
                e(HeroSlider, { language, heroQuoteButton: currentContent.heroQuoteButton, ariaLabels: currentContent.ariaLabels }),
                e(About, { content: currentContent.about }),
                e(Services, { content: currentContent.services }),
                e(Strengths, { content: currentContent.strengths }),
                e(Locations, { content: currentContent.locations }),
                e(Contact, { content: currentContent.contact })
            ),
            e(Footer, { language, setLanguage, content: currentContent.footer })
        );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(App));
  </script>
</body>
</html>
